# Live security checks against the deployed shop, dashboard and API, every day and on demand.
# Uses only public addresses (no secrets). A failure means a protection regressed: look at the log.
name: Security (live)

on:
  schedule:
    - cron: "17 5 * * *" # daily, 06:17 Lagos time
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["apps/**", "workers/**", "qa/security-check.mjs", "qa/live-smoke.mjs"]

jobs:
  live:
    name: Attack checks and policy smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Attack checks (auth, CORS, webhooks, redirects, database rules, headers)
        run: node qa/security-check.mjs
      - run: corepack pnpm --filter @hv/qa exec playwright install --with-deps chromium
      - name: Live sites still work under their security policies
        run: node qa/live-smoke.mjs
        env:
          CI: "1"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm audit --prod --audit-level=high
